<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星谱 · 家族星图</title>
<style>
:root{--bg:#070914;--panel:#0e1226ee;--line:#2a3158;--ink:#e8e9f5;--dim:#8d93b8;--gold:#ffd98a;--ice:#9fc4ff;--violet:#7c6cff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
font-family:"Noto Serif SC","Songti SC","Source Han Serif SC",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
header{position:fixed;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
header>*{pointer-events:auto}
h1{font-size:22px;font-weight:600;letter-spacing:.3em;margin:0 12px 0 0;color:var(--gold)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:#141935;border:1px solid var(--line);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.main{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
#legend{position:fixed;left:16px;right:16px;flex-wrap:wrap;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--dim);display:flex;gap:16px;pointer-events:none}
#legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#empty{position:fixed;inset:0;display:none;place-items:center;text-align:center;color:var(--dim);pointer-events:none;font-size:16px;line-height:2}
#panel{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:100%;background:var(--panel);backdrop-filter:blur(10px);border-left:1px solid var(--line);
padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;transform:translateX(100%);transition:transform .25s}
#panel.open{transform:none}
#panel label,#modal label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
#panel input[type=text],#panel select,#panel textarea,#modal input[type=text],#modal select,#modal textarea{width:100%;background:#0a0d1f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px}
#panel textarea,#modal textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px}.row>*{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
#ph{width:96px;height:96px;border-radius:50%;border:1px dashed var(--dim);background:#0a0d1f center/cover;display:grid;place-items:center;color:var(--dim);font-size:12px;cursor:pointer;margin:6px 0}
#close{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));background:none;border:0;font-size:26px;color:var(--dim);cursor:pointer}
.tip{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.7}
.danger{margin-top:18px;color:#ff8f8f;border-color:#5a2a3a}
.rels{flex-wrap:wrap;gap:6px;margin-top:10px}.rels .btn{padding:5px 8px;font-size:13px;flex:none}
#modal{position:fixed;inset:0;background:#02030acc;display:grid;place-items:center;z-index:9;padding:16px}
#modal[hidden],#modal [hidden]{display:none}
.card{position:relative;background:#0e1226;border:1px solid var(--line);border-radius:14px;padding:20px;width:430px;max-width:100%;max-height:92%;overflow:auto}
.card h2{margin:0 0 4px;font-size:18px;font-weight:600;color:var(--gold)}
.card p{font-size:13px;color:var(--dim);line-height:1.7;margin:6px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#ph{position:relative;overflow:hidden}#phImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#panel input[type=range]{width:100%}.soc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.soc a,.soc span{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ice);text-decoration:none;background:#141935}.soc a:hover{border-color:var(--gold)}
#menu{display:none;position:fixed;right:12px;top:calc(58px + env(safe-area-inset-top,0px));width:min(260px,calc(100vw - 24px));max-height:calc(100% - 90px);overflow:auto;flex-direction:column;gap:6px;padding:10px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;z-index:6}
#menu.open{display:flex}#menu .btn,#menu select{width:100%;min-height:42px;text-align:left;border-radius:10px}
#rv{white-space:pre-line}.jcard{border:1px solid var(--line);border-radius:12px;padding:2px 12px 12px;margin:12px 0}
.jcard h3{margin:10px 0 0;font-size:14px;color:var(--gold);font-weight:600}.jcard summary{cursor:pointer;margin-top:12px;color:var(--dim);font-size:13px}
@media(min-width:761px){#menu,#menu.open{display:contents}#mm{display:none}#menu .btn,#menu select{width:auto;min-height:0;text-align:center;border-radius:999px}}
@media(max-width:760px){#hint{display:none}#legend{font-size:11px;gap:10px}.btn{min-height:40px}header{gap:8px}}
@media(max-width:600px){#panel{top:auto;height:72%;width:100%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%)}h1{font-size:18px;letter-spacing:.2em;margin:0 auto 0 0}}
@media(prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header>
  <h1>星谱</h1>
  <button class="btn main" id="add">＋ 添加成员</button>
  <button class="btn main" id="joinBtn">申请加入</button>
  <button class="btn" id="tg2d"></button>
  <button class="btn" id="mm" aria-label="菜单" aria-expanded="false">☰</button>
  <div id="menu">
    <button class="btn" id="lay">整理星图</button>
    <button class="btn" id="tgPh"></button>
    <button class="btn" id="tgAuto"></button>
    <button class="btn" id="rst">重置视角</button>
    <button class="btn" id="inv">复制查看链接</button>
    <button class="btn" id="invE">复制编辑链接</button>
    <button class="btn" id="exp">导出数据</button>
    <button class="btn" id="imp">导入数据</button>
    <button class="btn" id="reload">载入线上版本</button>
    <button class="btn" id="rev">审核申请</button>
    <select id="lang" class="btn" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select>
  </div>
  <input type="file" id="impf" accept=".json" hidden>
</header>
<div id="empty">星空还是空的<br>点「添加成员」点亮第一颗星</div>
<div id="legend"><span><i style="background:var(--gold)"></i>在世</span><span><i style="background:var(--ice)"></i>已故</span><span id="hint"></span><span id="modeTxt"></span></div>

<aside id="panel" aria-label="成员资料">
  <button id="close" aria-label="关闭">×</button>
  <div id="ph" title="点击上传照片"><img id="phImg" alt=""><span id="phTxt">上传照片</span></div>
  <input type="file" id="phf" accept="image/*" hidden>
  <div id="phAdj" hidden>
    <label for="pr">旋转角度</label><input type="range" id="pr" min="-180" max="180">
    <label for="pz">放大</label><input type="range" id="pz" min="1" max="3" step="0.05">
    <label for="px">左右移动</label><input type="range" id="px" min="-50" max="50">
    <label for="py">上下移动</label><input type="range" id="py" min="-50" max="50">
    <button class="btn" id="prR" style="margin-top:8px">重置照片</button>
  </div>
  <div class="rels row"><button class="btn" data-rel="parent">＋父母</button><button class="btn" data-rel="spouse">＋配偶</button><button class="btn" data-rel="child">＋子女</button><button class="btn" data-rel="sibling">＋兄弟姐妹</button></div>
  <label for="name">姓名</label><input type="text" id="name">
  <label for="cname">华语名字（中文名）</label><input type="text" id="cname" placeholder="王小明">
  <div class="row">
    <div><label for="gender">性别</label><select id="gender"><option value="">未填</option><option value="m">男</option><option value="f">女</option></select></div>
    <div><label for="birth">生日 / 出生年份</label><input type="text" id="birth" placeholder="1950-03-12"></div>
  </div>
  <label class="chk"><input type="checkbox" id="alive"> 仍在世</label>
  <div id="deathBox"><label for="death">逝世日期 / 年份</label><input type="text" id="death" placeholder="2020"></div>
  <label for="place">出生地 / 居住地</label><input type="text" id="place">
  <div class="row">
    <div><label for="father">父亲</label><select id="father"></select></div>
    <div><label for="mother">母亲</label><select id="mother"></select></div>
  </div>
  <label for="spouse">配偶</label><select id="spouse"></select>
  <label for="note">备注 / 生平</label><textarea id="note"></textarea>
  <div id="socWrap"><label>社交链接</label><div id="socIn"></div></div><div id="socView" class="soc"></div>
  <p class="tip">修改会自动保存在本浏览器中。要让所有访客看到，请点「导出数据」，把下载的文件改名为 data.json 放进 GitHub 仓库。</p>
  <button class="btn danger" id="del">删除这位成员</button>
</aside>
<div id="modal" hidden><div class="card" role="dialog" aria-modal="true">
<button id="mx" aria-label="关闭" style="position:absolute;right:10px;top:6px;background:none;border:0;font-size:26px;color:var(--dim);cursor:pointer">×</button>
<div id="joinBox">
<h2>申请加入家族星图</h2>
<p>先简单介绍你是谁，再填写要加入的人（可以一次加入你的家人）。完成后用 WhatsApp 发给站长，审核通过后就会出现在星图里。</p>
<label for="jw">你是谁？（让站长认得你）</label><input type="text" id="jw">
<div id="jcards"></div>
<button class="btn" id="jadd">＋ 同时添加我的家人</button>
<div class="acts"><button class="btn main" id="jwa">发送给站长（WhatsApp）</button><button class="btn" id="jcp">复制申请内容</button><button class="btn" id="jdl">下载申请文件（含照片）</button><button class="btn" id="jgh">提交到 GitHub</button></div>
<p>照片只会放进「下载申请文件」；WhatsApp、复制内容和 GitHub 提交只含文字。</p>
</div>
<div id="reviewBox" hidden>
<h2>审核加入申请</h2>
<p>粘贴亲人发来的申请内容，或选择申请文件，确认后再接受。</p>
<textarea id="rt"></textarea><input type="file" id="rf" accept=".json" style="margin-top:8px">
<p id="rv"></p>
<div class="acts"><button class="btn" id="rd">读取</button><button class="btn main" id="rvok" hidden>接受并加入</button><button class="btn" id="rno">清除</button></div>
</div>
</div></div>

<script>
const EDIT = location.protocol==='file:' || new URLSearchParams(location.search).has('edit'); // 默认只读查看；网址后加 ?edit=1 进入编辑模式
const READONLY = !EDIT;
const REPO = ''; // 填你的 GitHub 仓库，如 'yourname/family-stars'，访客才能一键提交加入申请
const OWNER_WA = '60178661928'; // 站长 WhatsApp：国家码+号码，不带 + 和空格（+60 17-866 1928）
const KEY = 'xingpu-family-v1';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let people = [], sel = null, view = {x:0,y:0,k:1}, W, H, DPR = 1;
const imgs = {};
const START_2D = false; // 首次打开是否默认显示 2D 平面图
let lang; try{lang=localStorage.getItem('xingpu-lang')}catch(e){} lang=lang||(/^zh/i.test(navigator.language)?'zh':'en');
let dirty2=true; const SER=(k,v)=>k[0]==='_'?undefined:v;
const DICT={'星谱':'Star Map','添加成员':'Add member','整理星图':'Auto-arrange','导出数据':'Export data','导入数据':'Import data',
'显示：照片':'Show: Photos','显示：星星':'Show: Stars','自动旋转：开':'Auto-rotate: On','自动旋转：关':'Auto-rotate: Off','视图：3D':'View: 3D','视图：2D':'View: 2D',
'重置视角':'Reset view','复制查看链接':'Copy view link','复制编辑链接':'Copy edit link','载入线上版本':'Load online version','申请加入':'Request to join','审核申请':'Review requests','链接已复制 ✓':'Link copied ✓',
'在世':'Living','已故':'Deceased','拖动旋转 · Shift/右键拖动平移 · 滚轮缩放':'Drag to rotate · Shift/right-drag to pan · Scroll to zoom','拖动平移 · 滚轮缩放':'Drag to pan · Scroll to zoom',
'实时家族星图 · 显示站长发布的最新资料':'Live family star map · latest data from the site owner',
'编辑模式（本机草稿）：修改只保存在这台设备，完成后点「导出数据」发给站长':'Edit mode (local draft): changes stay on this device. When done, click “Export data” and send it to the site owner',
'编辑模式：修改只保存在这台设备，完成后点「导出数据」发给站长':'Edit mode: changes stay on this device. When done, click “Export data” and send it to the site owner',
'还没有发布家族资料':'No family data has been published yet','请稍后再来看看':'Please check back later','星空还是空的':'The sky is still empty','点「添加成员」点亮第一颗星':'Click “Add member” to light the first star',
'上传照片':'Upload photo','旋转角度':'Rotation','放大':'Zoom','左右移动':'Move left/right','上下移动':'Move up/down','重置照片':'Reset photo','姓名':'Name','华语名字（中文名）':'Chinese name',
'性别':'Gender','未填':'Not set','男':'Male','女':'Female','生日 / 出生年份':'Birthday / birth year','仍在世':'Still living','逝世日期 / 年份':'Date / year of passing','出生地 / 居住地':'Birthplace / residence',
'父亲':'Father','母亲':'Mother','配偶':'Spouse','备注 / 生平':'Notes / biography','社交链接':'Social links','其他链接':'Other link','小红书':'Xiaohongshu (RED)','删除这位成员':'Delete this member',
'＋父母':'+ Parent','＋配偶':'+ Spouse','＋子女':'+ Child','＋兄弟姐妹':'+ Sibling','子女':'Child','父母':'Parent','兄弟姐妹':'Sibling',
'修改会自动保存在本浏览器中。要让所有访客看到，请点「导出数据」，把下载的文件改名为 data.json 放进 GitHub 仓库。':'Changes are saved automatically in this browser. To show them to everyone, click “Export data”, rename the file to data.json and upload it to your GitHub repository.',
'申请加入家族星图':'Request to join the family star map','填写你的资料，选择你是星图里哪位成员的亲人，把申请发给站长。审核通过后，你会成为星图里的一颗新星。':'Fill in your details and choose which member you are related to, then send the request to the site owner. Once approved, you will become a new star.',
'你的姓名':'Your name','华语名字（中文名，可选）':'Chinese name (optional)','我是（成员）的（关系）':'I am the (relation) of (member)','照片（可选）':'Photo (optional)','想说的话（可选）':'Message (optional)',
'提交到 GitHub':'Submit via GitHub','复制申请内容':'Copy request text','下载申请文件':'Download request file','照片只会放进「下载申请文件」；复制内容和 GitHub 提交只含文字。':'The photo is only included in the downloaded file; copied text and GitHub submissions contain text only.',

'读取':'Read','接受并加入':'Accept and add','清除':'Clear','读取失败：请粘贴完整的申请内容（以 { 开头），或选择申请文件。':'Could not read it. Paste the complete request (starting with {) or choose the request file.',
'请填写你的姓名':'Please enter your name','请选择你是哪位成员的亲人':'Please choose which member you are related to','已复制，请发给站长（WhatsApp、微信或邮件都可以）。':'Copied. Send it to the site owner (WhatsApp, WeChat or email all work).',
'复制申请内容：':'Copy the request text:','找不到对应成员。':'Member not found.','已有配偶，请先在“配偶”栏更改。':'This person already has a spouse. Change it in the Spouse field first.','已有两位父母。':'Already has two parents.',
'复制这个查看链接发给亲人：':'Copy this view link and send it to your relatives:','复制这个编辑链接发给要补充资料的亲人：':'Copy this edit link and send it to relatives who will add details:',
'放弃本机草稿，改用线上最新版本？':'Discard the local draft and use the latest online version?','读不到线上的 data.json。请在已发布的网站上使用此功能（本地直接打开文件时无法读取）。':'Could not read the online data.json. Use this on the published site (it cannot be read when opening the file locally).',
'文件格式不正确，请选择由本站导出的 JSON 文件。':'Invalid file. Please choose a JSON file exported from this site.',
'合并到现有资料？\n确定=合并（相同成员以新文件为准）；取消=用新文件替换全部':'Merge into existing data?\nOK = merge (same members use the new file); Cancel = replace everything with the new file'};
Object.assign(DICT,{'＋ 添加成员':'+ Add member','你是谁？（让站长认得你）':'Who are you? (so the site owner recognises you)',
'先简单介绍你是谁，再填写要加入的人（可以一次加入你的家人）。完成后用 WhatsApp 发给站长，审核通过后就会出现在星图里。':'Tell us who you are, then fill in the people to add (you can add your family members at once). Send it to the site owner via WhatsApp; once approved they will appear on the map.',
'＋ 同时添加我的家人':'+ Also add my family members','发送给站长（WhatsApp）':'Send to the site owner (WhatsApp)','下载申请文件（含照片）':'Download request file (with photos)',
'这位是（成员）的（关系）':'This person is the (relation) of (member)','社交链接（可选）':'Social links (optional)','备注（可选）':'Notes (optional)','移除这位':'Remove this person',
'请填写“你是谁”，让站长认得你':'Please tell the site owner who you are','请填写每位成员的姓名':'Please enter a name for every person','请为每位成员选择关系对象':'Please choose who each person is related to',
'内容较长，已复制到剪贴板，请在 WhatsApp 对话里粘贴发送。':'The message is long and has been copied. Please paste it into the WhatsApp chat.',
'照片只会放进「下载申请文件」；WhatsApp、复制内容和 GitHub 提交只含文字。':'Photos are only included in the downloaded file; WhatsApp, copied text and GitHub submissions contain text only.'});
const L=(zh,en)=>lang==='en'?en:zh, T=m=>lang==='en'&&DICT[m]||m;
const _al=alert,_cf=confirm,_pr=prompt; window.alert=m=>_al(T(m)); window.confirm=m=>_cf(T(m)); window.prompt=(m,v)=>_pr(T(m),v);
const names=p=>{ const a=(p.name||'').trim(), b=(p.cname||'').trim(); if(!a&&!b) return [L('未命名','Unnamed'),''];
  const [x,y]=lang==='zh'?[b||a,b?a:'']:[a||b,a?b:'']; return [x,y&&y!==x?y:'']; };
function drawPh(im,x,y,r,p){ const w=im.naturalWidth,h=im.naturalHeight,sc=2*r/Math.min(w,h)*(p.pz||1);
  ctx.save(); ctx.translate(x+(p.px||0)/100*r,y+(p.py||0)/100*r); ctx.rotate((p.pr||0)*Math.PI/180); ctx.drawImage(im,-w*sc/2,-h*sc/2,w*sc,h*sc); ctx.restore(); }

/* ---------- 数据 ---------- */
const sample = () => [
  {id:'a1',name:'爷爷',gender:'m',birth:'1935',alive:false,death:'2012',spouse:'a2',parents:[]},
  {id:'a2',name:'奶奶',gender:'f',birth:'1938',alive:false,death:'2019',spouse:'a1',parents:[]},
  {id:'b1',name:'爸爸',gender:'m',birth:'1962-05-08',alive:true,spouse:'b2',parents:['a1','a2']},
  {id:'b2',name:'妈妈',gender:'f',birth:'1965-11-20',alive:true,spouse:'b1',parents:[]},
  {id:'c1',name:'我',gender:'',birth:'1992-02-14',alive:true,parents:['b1','b2']}
];
function save(){ dirty2=true; if(READONLY) return; try{localStorage.setItem(KEY,JSON.stringify(people,SER))}catch(e){} }
let draft=false;
const fetchLive=()=>fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>Array.isArray(d)?d:Promise.reject());
function load(){
  let d=null; if(!READONLY){ try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){} }
  if(d&&d.length){ people=d; draft=true; start(); return; }
  fetchLive().then(x=>{people=x}).catch(()=>{people=READONLY?[]:sample()}).finally(start);
}
function start(){
  if(people.some(p=>p.x==null||p.z==null)) layout();
  $('modeTxt').textContent=READONLY?'实时家族星图 · 显示站长发布的最新资料':(draft?'编辑模式（本机草稿）':'编辑模式')+'：修改只保存在这台设备，完成后点「导出数据」发给站长';
  resize(); fit(); toggleEmpty(); setHint(); syncB();
}
const byId = id => people.find(p=>p.id===id);
const toggleEmpty = () => { $('empty').style.display = people.length ? 'none':'grid'; $('empty').innerHTML = READONLY ? '还没有发布家族资料<br>请稍后再来看看' : '星空还是空的<br>点「添加成员」点亮第一颗星'; };
const year = s => (s||'').slice(0,4);

/* ---------- 布局：按辈分分行，配偶相邻 ---------- */
function layout(tidy){
  const X=q=>tidy?q._x2:q.x;
  const gen = {};
  const g = p => { if(gen[p.id]!=null) return gen[p.id]; gen[p.id]=0;
    let v = 0; (p.parents||[]).forEach(i=>{const q=byId(i); if(q) v=Math.max(v,g(q)+1)}); return gen[p.id]=v; };
  people.forEach(g);
  people.forEach(p=>{const s=byId(p.spouse); if(s){const m=Math.max(gen[p.id],gen[s.id]); gen[p.id]=gen[s.id]=m}});
  const rows = {};
  people.forEach(p=>(rows[gen[p.id]] = rows[gen[p.id]]||[]).push(p));
  Object.keys(rows).sort((a,b)=>a-b).forEach(k=>{
    const r = rows[k];
    const key = p => { const xs=(p.parents||[]).map(byId).filter(q=>q&&X(q)!=null).map(X); return xs.length? xs.reduce((a,b)=>a+b)/xs.length : 0 };
    r.sort((a,b)=>key(a)-key(b));
    const out=[], seen=new Set();
    r.forEach(p=>{ if(seen.has(p.id))return; seen.add(p.id); out.push(p);
      const s=byId(p.spouse); if(s&&!seen.has(s.id)&&r.includes(s)){seen.add(s.id);out.push(s)} });
    out.forEach((p,i)=>{ if(tidy){ p._x2=(i-(out.length-1)/2)*170; p._y2=k*190; } else { p.x = (i-(out.length-1)/2)*150; p.y = k*170 + (i%2?14:-14); } });
  });
  if(tidy) return;
  const root = p=>{ let c=p,n=0; while(n++<50){ const q=byId((c.parents||[])[0])||byId((c.parents||[])[1]); if(!q) break; c=q; } return c.id; };
  const roots=[...new Set(people.map(root))];
  people.forEach(p=>p.z=(roots.indexOf(root(p))-(roots.length-1)/2)*130);
  people.forEach(p=>{ const q=byId(p.spouse); if(q&&p.id<q.id) p.z=q.z=(p.z+q.z)/2; });
  save();
}
function fit(){
  if(!people.length){ ctr={x:0,y:0,z:0}; view={x:W/2,y:H/2,k:1}; return }
  if(M2) layout(true);
  const X=p=>M2?p._x2:p.x, Y=p=>M2?p._y2:p.y, mm=a=>[Math.min(...a),Math.max(...a)];
  const [x0,x1]=mm(people.map(X)),[y0,y1]=mm(people.map(Y)),[z0,z1]=mm(people.map(p=>M2?0:(p.z||0)));
  ctr={x:(x0+x1)/2,y:(y0+y1)/2,z:(z0+z1)/2};
  view.k=Math.min(1.2,W/(x1-x0+260),H/(y1-y0+280)); view.x=W/2; view.y=H/2;
}

/* ---------- 绘制（3D） ---------- */
let bg=[], cam={yaw:.4,pitch:.3}, auto=false, showPhoto=true, ctr={x:0,y:0,z:0}, D=1100;
try{ showPhoto=localStorage.getItem(KEY+'-ph')!=='0' }catch(e){}
let M2=START_2D||matchMedia('(max-width:760px)').matches; try{ const v=localStorage.getItem(KEY+'-2d'); if(v!=null) M2=v==='1' }catch(e){}
function resize(){
  DPR=window.devicePixelRatio||1; W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  bg=Array.from({length:Math.round(W*H/2600)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.2,t:Math.random()*6,z:Math.random()*.5+.1}));
}
const R=26;
const colorOf=p=>p.alive===false?'159,196,255':'255,217,138';
function proj(p){
  if(M2) return {sx:view.x+(p._x2-ctr.x)*view.k,sy:view.y+(p._y2-ctr.y)*view.k,f:1,z:0};
  const ca=Math.cos(cam.yaw),sa=Math.sin(cam.yaw),cb=Math.cos(cam.pitch),sb=Math.sin(cam.pitch);
  const x=p.x-ctr.x,y=p.y-ctr.y,z=(p.z||0)-ctr.z;
  const x1=x*ca+z*sa,z1=-x*sa+z*ca,y2=y*cb-z1*sb,z2=y*sb+z1*cb;
  const f=D/Math.max(80,D+z2);
  return {sx:view.x+x1*view.k*f,sy:view.y+y2*view.k*f,f,z:z2};
}
function frame(t){
  ctx.clearRect(0,0,W,H);
  const gr=ctx.createRadialGradient(W*.5,H*.4,0,W*.5,H*.4,Math.max(W,H)*.8);
  gr.addColorStop(0,'#141a3c'); gr.addColorStop(1,'#070914'); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  bg.forEach(s=>{ const px=((s.x-cam.yaw*500*s.z)%W+W)%W, py=((s.y+cam.pitch*500*s.z)%H+H)%H;
    ctx.globalAlpha=.35+.35*Math.sin(t/900+s.t); ctx.fillStyle='#cfd6ff'; ctx.beginPath(); ctx.arc(px,py,s.r,0,7); ctx.fill(); });
  if(auto&&!drag&&!M2) cam.yaw-=.003;
  if(M2&&dirty2){ layout(true); dirty2=false; }
  people.forEach(p=>p._s=proj(p));
  // 连线
  people.forEach(p=>{
    const a=p._s;
    (p.parents||[]).forEach(i=>{ const q=byId(i); if(!q) return; const b=q._s, f=(a.f+b.f)/2;
      const g=ctx.createLinearGradient(b.sx,b.sy,a.sx,a.sy); g.addColorStop(0,'rgba('+colorOf(q)+',.55)'); g.addColorStop(1,'rgba('+colorOf(p)+',.55)');
      ctx.globalAlpha=Math.min(1,f); ctx.strokeStyle=g; ctx.lineWidth=1.4*f; ctx.beginPath(); ctx.moveTo(b.sx,b.sy);
      ctx.bezierCurveTo(b.sx,(b.sy+a.sy)/2,a.sx,(b.sy+a.sy)/2,a.sx,a.sy); ctx.stroke(); });
    const q=byId(p.spouse);
    if(q&&p.id<q.id){ const b=q._s; ctx.globalAlpha=Math.min(1,(a.f+b.f)/2); ctx.setLineDash([5,6]); ctx.strokeStyle='rgba(124,108,255,.85)'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.quadraticCurveTo((a.sx+b.sx)/2,(a.sy+b.sy)/2-30*view.k,b.sx,b.sy); ctx.stroke(); ctx.setLineDash([]); }
  });
  // 星星：由远到近
  [...people].sort((a,b)=>b._s.z-a._s.z).forEach(p=>{
    const s=p._s, c=colorOf(p), alive=p.alive!==false, pulse=alive?1+.07*Math.sin(t/600+p.x):1;
    const rr=R*view.k*s.f*pulse, isSel=sel===p.id;
    ctx.globalAlpha=Math.max(.4,Math.min(1,s.f*1.1));
    const halo=ctx.createRadialGradient(s.sx,s.sy,rr*.4,s.sx,s.sy,rr*3);
    halo.addColorStop(0,'rgba('+c+','+(isSel?.5:.3)+')'); halo.addColorStop(1,'rgba('+c+',0)');
    ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(s.sx,s.sy,rr*3,0,7); ctx.fill();
    if(!showPhoto){ const L=rr*2.6, tw=.75+.25*Math.sin(t/700+p.y);
      [[1,0],[0,1]].forEach(([ux,uy])=>{ const g=ctx.createLinearGradient(s.sx-ux*L,s.sy-uy*L,s.sx+ux*L,s.sy+uy*L);
        g.addColorStop(0,'rgba('+c+',0)'); g.addColorStop(.5,'rgba('+c+','+(.7*tw)+')'); g.addColorStop(1,'rgba('+c+',0)');
        ctx.strokeStyle=g; ctx.lineWidth=Math.max(.8,1.2*s.f); ctx.beginPath(); ctx.moveTo(s.sx-ux*L,s.sy-uy*L); ctx.lineTo(s.sx+ux*L,s.sy+uy*L); ctx.stroke(); }); }
    let edge=rr;
    if(showPhoto){
      ctx.save(); ctx.beginPath(); ctx.arc(s.sx,s.sy,rr,0,7); ctx.clip();
      const im=photo(p);
      ctx.fillStyle='rgb('+c+')'; ctx.fillRect(s.sx-rr,s.sy-rr,rr*2,rr*2); if(im) drawPh(im,s.sx,s.sy,rr,p);
      ctx.restore();
      ctx.lineWidth=isSel?3:1.6; ctx.strokeStyle='rgb('+c+')'; ctx.beginPath(); ctx.arc(s.sx,s.sy,rr,0,7); ctx.stroke();
    } else {
      edge=rr*.6; const r2=rr*.75;
      const core=ctx.createRadialGradient(s.sx,s.sy,0,s.sx,s.sy,r2);
      core.addColorStop(0,'#fff'); core.addColorStop(.35,'rgb('+c+')'); core.addColorStop(1,'rgba('+c+',0)');
      ctx.fillStyle=core; ctx.beginPath(); ctx.arc(s.sx,s.sy,r2,0,7); ctx.fill();
      if(isSel){ ctx.lineWidth=2; ctx.strokeStyle='rgb('+c+')'; ctx.beginPath(); ctx.arc(s.sx,s.sy,rr*.9,0,7); ctx.stroke(); }
    }
    const fs=Math.max(9,15*view.k*s.f);
    ctx.textAlign='center'; ctx.fillStyle='#e8e9f5'; ctx.font='600 '+fs+'px "Noto Serif SC","Songti SC",serif';
    const [n1,n2]=names(p); let yy=s.sy+edge+fs*1.3; ctx.fillText(n1,s.sx,yy);
    if(n2){ yy+=fs*1.15; ctx.fillStyle='#c9cdea'; ctx.font=(fs*.85)+'px "Noto Serif SC",serif'; ctx.fillText(n2,s.sx,yy); }
    const yrs=year(p.birth)?year(p.birth)+(alive?'':' – '+(year(p.death)||'?')):'';
    if(yrs){ yy+=fs*1.1; ctx.fillStyle='#8d93b8'; ctx.font=(fs*.8)+'px "Noto Serif SC",serif'; ctx.fillText(yrs,s.sx,yy); }
  });
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
function photo(p){
  if(!p.photo) return null;
  if(!imgs[p.id]||imgs[p.id].src!==p.photo){ const i=new Image(); i.src=p.photo; imgs[p.id]=i; }
  return imgs[p.id].complete&&imgs[p.id].naturalWidth?imgs[p.id]:null;
}

/* ---------- 交互：旋转 / 平移 / 缩放 / 拖星 ---------- */
const hit=(x,y)=>[...people].sort((a,b)=>a._s.z-b._s.z).find(p=>{const s=p._s;return s&&Math.hypot(s.sx-x,s.sy-y)<Math.max(R*view.k*s.f,14)+8});
function nodeMove(p,dx,dy){
  const k=view.k*p._s.f, cx=dx/k, cy=dy/k;
  const ca=Math.cos(cam.yaw),sa=Math.sin(cam.yaw),cb=Math.cos(cam.pitch),sb=Math.sin(cam.pitch);
  const z1=-cy*sb; p.x+=cx*ca-z1*sa; p.y+=cy*cb; p.z=(p.z||0)+cx*sa+z1*ca;
}
let drag=null, pts=new Map(), pinch=1, mid=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ drag=null; const [a,b]=[...pts.values()]; pinch=Math.hypot(a.x-b.x,a.y-b.y)||1; mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; return; }
  const p=hit(e.clientX,e.clientY);
  drag={type:p?'node':(M2||e.shiftKey||e.button===2?'pan':'orbit'),p,d:0,moved:false,lx:e.clientX,ly:e.clientY};
  cv.classList.add('drag');
});
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1, m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    view.x+=m.x-mid.x; view.y+=m.y-mid.y; zoomAt(m.x,m.y,d/pinch); pinch=d; mid=m; return; }
  if(!drag) return;
  const dx=e.clientX-drag.lx, dy=e.clientY-drag.ly; drag.lx=e.clientX; drag.ly=e.clientY;
  drag.d+=Math.abs(dx)+Math.abs(dy); if(drag.d>4) drag.moved=true; if(!drag.moved) return;
  if(drag.type==='node'){ if(!READONLY&&!M2) nodeMove(drag.p,dx,dy); }
  else if(drag.type==='pan'){ view.x+=dx; view.y+=dy; }
  else { cam.yaw-=dx*.006; cam.pitch=Math.max(-1.4,Math.min(1.4,cam.pitch+dy*.006)); }
});
cv.addEventListener('pointerup',e=>{
  pts.delete(e.pointerId); cv.classList.remove('drag');
  if(drag){ if(drag.type==='node'){ if(!drag.moved) openPanel(drag.p.id); else save(); } else if(!drag.moved) closePanel(); }
  drag=null;
});
cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);drag=null;cv.classList.remove('drag')});
function zoomAt(x,y,f){ const k=Math.min(3,Math.max(.2,view.k*f)); f=k/view.k; view.x=x-(x-view.x)*f; view.y=y-(y-view.y)*f; view.k=k; }
cv.addEventListener('wheel',e=>{e.preventDefault(); zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015))},{passive:false});

/* ---------- 资料面板 ---------- */
const F = ['name','cname','gender','birth','death','place','note'];
function opts(el,skip,val,label){
  el.innerHTML='<option value="">'+label+'</option>'+people.filter(p=>p.id!==skip).map(p=>'<option value="'+p.id+'">'+esc(p.name||'未命名')+'</option>').join('');
  el.value=val||'';
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openPanel(id){
  sel=id; const p=byId(id); if(!p) return;
  F.forEach(f=>$(f).value=p[f]||''); fillExtra(p);
  $('alive').checked = p.alive!==false; $('deathBox').style.display = $('alive').checked?'none':'block';
  opts($('father'),id,(p.parents||[])[0],'未填'); opts($('mother'),id,(p.parents||[])[1],'未填'); opts($('spouse'),id,p.spouse,'未填');
  
  document.querySelectorAll('#panel input,#panel select,#panel textarea,#del,.rels button').forEach(el=>el.disabled=READONLY);
  $('panel').classList.add('open'); if(innerWidth<=600&&p._s){ view.x+=innerWidth/2-p._s.sx; view.y+=innerHeight*.2-p._s.sy; }
}
function closePanel(){ sel=null; $('panel').classList.remove('open'); }
$('close').onclick=closePanel;
F.forEach(f=>$(f).addEventListener('input',()=>{ const p=byId(sel); if(p){p[f]=$(f).value; save();} }));
$('alive').onchange=()=>{ const p=byId(sel); p.alive=$('alive').checked; $('deathBox').style.display=p.alive?'none':'block'; save(); };
const parents = ()=>[$('father').value,$('mother').value].filter(Boolean);
['father','mother'].forEach(k=>$(k).onchange=()=>{ byId(sel).parents=parents(); save(); });
$('spouse').onchange=()=>{ const p=byId(sel);
  const old=byId(p.spouse); if(old) old.spouse=''; p.spouse=$('spouse').value;
  const s=byId(p.spouse); if(s){ const o=byId(s.spouse); if(o&&o!==p) o.spouse=''; s.spouse=p.id; } save(); };
$('ph').onclick=()=>!READONLY&&$('phf').click();
$('phf').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ const im=new Image(); im.onload=()=>{ const q=Math.min(1,420/Math.max(im.width,im.height)), c=document.createElement('canvas');
    c.width=Math.round(im.width*q); c.height=Math.round(im.height*q); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const p=byId(sel); p.photo=c.toDataURL('image/jpeg',.85); p.pr=0; p.pz=1; p.px=0; p.py=0; save(); showPh(p); };
    im.src=rd.result; }; rd.readAsDataURL(f); e.target.value=''; };
const DEF={pr:0,pz:1,px:0,py:0};
function showPh(p){
  const im=$('phImg'); im.style.display=p.photo?'block':'none'; $('phTxt').style.display=p.photo?'none':'';
  if(p.photo){ im.src=p.photo; im.style.transform='translate('+(p.px||0)/2+'%,'+(p.py||0)/2+'%) rotate('+(p.pr||0)+'deg) scale('+(p.pz||1)+')'; }
  $('phAdj').hidden=!p.photo||READONLY; Object.keys(DEF).forEach(k=>$(k).value=p[k]==null?DEF[k]:p[k]);
}
Object.keys(DEF).forEach(k=>$(k).addEventListener('input',()=>{ const p=byId(sel); if(!p) return; p[k]=+$(k).value; save(); showPh(p); }));
$('prR').onclick=()=>{ const p=byId(sel); Object.assign(p,DEF); save(); showPh(p); };
const SOC=[['whatsapp','WhatsApp'],['wechat','WeChat'],['facebook','Facebook'],['instagram','Instagram'],['telegram','Telegram'],['tiktok','TikTok'],['xhs','小红书'],['link','其他链接']];

const noAt=v=>v.replace(/^@/,'');
const URLS={whatsapp:v=>'https://wa.me/'+v.replace(/\D/g,''),facebook:v=>'https://facebook.com/'+noAt(v),instagram:v=>'https://instagram.com/'+noAt(v),telegram:v=>'https://t.me/'+noAt(v),tiktok:v=>'https://tiktok.com/@'+noAt(v)};
function renderSoc(p){ const box=$('socView'); box.textContent=''; const so=p.social||{};
  SOC.forEach(([k,n])=>{ const v=(so[k]||'').trim(); if(!v) return;
    const href=/^https?:\/\//i.test(v)?v:(URLS[k]?URLS[k](v):''), ok=/^https?:\/\//i.test(href);

SOC.forEach(([k])=>$('s_'+k).addEventListener('input',()=>{ const p=byId(sel); if(!p) return; (p.social=p.social||{})[k]=$('s_'+k).value.trim(); save(); renderSoc(p); }));

if(READONLY) $('socWrap').style.display='none';
$('del').onclick=()=>{ const p=byId(sel); if(!p||!confirm(L('确定删除「'+names(p)[0]+'」？','Delete “'+names(p)[0]+'”?'))) return;
  people=people.filter(q=>q!==p); people.forEach(q=>{ q.parents=(q.parents||[]).filter(i=>i!==p.id); if(q.spouse===p.id) q.spouse=''; });
  closePanel(); save(); toggleEmpty(); };

function newP(o,b){ const p=Object.assign({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),name:'新成员',alive:true,parents:[],x:b.x,y:b.y,z:b.z||0},o); people.push(p); return p; }
function addRel(t){
  const b=byId(sel); if(!b) return; let n;
  if(t==='spouse'){ if(b.spouse) return alert('已有配偶，请先在“配偶”栏更改。'); n=newP({name:'配偶',spouse:b.id},{x:b.x+150,y:b.y,z:b.z}); b.spouse=n.id; }
  else if(t==='child'){ n=newP({name:'孩子',parents:[b.id,b.spouse].filter(Boolean)},{x:b.x-40+Math.random()*80,y:b.y+170,z:b.z}); }
  else if(t==='parent'){ const ps=b.parents||[]; if(ps.length>=2) return alert('已有两位父母。');
    n=newP({name:'父母'},{x:b.x+(ps.length?150:0),y:b.y-170,z:b.z}); const o=byId(ps[0]); if(o&&!o.spouse){o.spouse=n.id;n.spouse=o.id;} b.parents=[...ps,n.id]; }
  else { let ps=(b.parents||[]).slice(); if(!ps.length){ const m=newP({name:'父母'},{x:b.x,y:b.y-170,z:b.z}); b.parents=ps=[m.id]; }
    n=newP({name:'兄弟姐妹',parents:ps},{x:b.x+150,y:b.y,z:b.z}); }
  save(); toggleEmpty(); openPanel(n.id); $('name').select();
}
document.querySelectorAll('[data-rel]').forEach(el=>el.onclick=()=>addRel(el.dataset.rel));

  fetchLive().then(d=>{ people=d; draft=false; closePanel(); if(people.some(p=>p.x==null||p.z==null)) layout(); save(); fit(); toggleEmpty(); start(); })
  .catch(()=>alert('读不到线上的 data.json。请在已发布的网站上使用此功能（本地直接打开文件时无法读取）。')); };
if(READONLY) ['invE','reload'].forEach(i=>$(i).style.display='none');
let jn=0;
function shrink(f,cb){ if(!f) return cb(''); const rd=new FileReader();
  rd.onload=()=>{ const im=new Image(); im.onload=()=>{ const q=Math.min(1,360/Math.max(im.width,im.height)), c=document.createElement('canvas');
    c.width=Math.round(im.width*q); c.height=Math.round(im.height*q); c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.82)); }; im.src=rd.result; }; rd.readAsDataURL(f); }
function initJoin(){ $('jcards').textContent=''; jn=0; $('jw').value=''; $('jw').placeholder=L('例如：我是王五的堂弟，住在槟城','e.g. I am Wang Wu’s cousin, living in Penang'); addCard(); $('jgh').hidden=!REPO; }
function refreshTargets(){
  const cs=[...$('jcards').children];
  cs.forEach((c,i)=>{
    c.querySelector('.jt').textContent=i?L('家人 '+i,'Family member '+i):L('你本人','You');
    const sl=c.querySelector('.c-to'), cur=sl.value;
    sl.innerHTML='<option value="">'+L('请选择成员','Select a member')+'</option>'+people.map(p=>'<option value="'+p.id+'">'+esc(names(p)[0])+'</option>').join('')
      +cs.filter(x=>x!==c).map(x=>'<option value="'+x.dataset.k+'">'+esc(L('（本次申请）','(this request) ')+(x.querySelector('.c-name').value.trim()||L('未命名','Unnamed')))+'</option>').join('');
    sl.value=[...sl.options].some(o=>o.value===cur)?cur:(i?cs[0].dataset.k:'');
  });
}
function addCard(){
  const d=document.createElement('div'); d.className='jcard'; d.dataset.k='#'+(++jn); d._ph='';
  d.innerHTML='<h3 class="jt"></h3><label>姓名<input type="text" class="c-name"></label><label>华语名字（中文名，可选）<input type="text" class="c-cname"></label>'
   +'<div class="row"><label>性别<select class="c-g"><option value="">未填</option><option value="m">男</option><option value="f">女</option></select></label><label>生日 / 出生年份<input type="text" class="c-b" placeholder="1990"></label></div>'
   +'<label class="chk"><input type="checkbox" class="c-a" checked> 仍在世</label><label>这位是（成员）的（关系）</label>'
   +'<div class="row"><select class="c-to"></select><select class="c-rel"><option value="child">子女</option><option value="spouse">配偶</option><option value="parent">父母</option><option value="sibling">兄弟姐妹</option></select></div>'
   +'<details><summary>社交链接（可选）</summary>'+SOC.map(([k,n])=>'<label>'+n+'<input type="text" class="c-s-'+k+'"></label>').join('')+'</details>'
   +'<label>照片（可选）<input type="file" accept="image/*" class="c-ph"></label><label>备注（可选）<textarea class="c-note"></textarea></label><button class="btn c-rm" type="button" style="margin-top:10px">移除这位</button>';
  const first=!$('jcards').children.length; if(first) d.querySelector('.c-rm').hidden=true;
  d.querySelector('.c-name').oninput=refreshTargets; d.querySelector('.c-rm').onclick=()=>{ d.remove(); refreshTargets(); };
  d.querySelector('.c-ph').onchange=e=>shrink(e.target.files[0],u=>d._ph=u);
  $('jcards').appendChild(d); refreshTargets();
}
$('jadd').onclick=addCard;
function buildReq(withPhoto){
  const who=$('jw').value.trim(); if(!who){ alert('请填写“你是谁”，让站长认得你'); return null; }
  const list=[];
  for(const c of $('jcards').children){
    const q=k=>c.querySelector(k), name=q('.c-name').value.trim(), to=q('.c-to').value;
    if(!name){ alert('请填写每位成员的姓名'); return null; } if(!to){ alert('请为每位成员选择关系对象'); return null; }
    const social={}; SOC.forEach(([k])=>{ const v=q('.c-s-'+k).value.trim(); if(v) social[k]=v; }); const t=byId(to);
    const o={k:c.dataset.k,name,cname:q('.c-cname').value.trim(),gender:q('.c-g').value,birth:q('.c-b').value.trim(),alive:q('.c-a').checked,note:q('.c-note').value.trim(),social,rel:q('.c-rel').value,to,toName:t?t.name:''};
    if(withPhoto&&c._ph) o.photo=c._ph; list.push(o);
  }
  return {type:'join-request',v:2,from:who,people:list};
}
function summary(r){
  const nm=o=>o.name+(o.cname?'（'+o.cname+'）':''), tn=o=>{ const x=r.people.find(q=>q.k===o.to); return x?nm(x):(o.toName||'?'); };
  return L('【家族星图 加入申请】','[Family Star Map – join request]')+'\n'+L('我是：','I am: ')+r.from+'\n'
    +r.people.map((o,i)=>(i+1)+'. '+nm(o)+' — '+L('是「'+tn(o)+'」的'+(RL[o.rel]||'子女'),'is the '+(o.rel||'child')+' of '+tn(o))).join('\n');
}
const msgText=r=>summary(r)+'\n\n'+L('（以下为系统数据，请勿修改）','(system data below – please do not edit)')+'\n'+JSON.stringify(r);
$('jwa').onclick=()=>{ const r=buildReq(false); if(!r) return; const t=msgText(r), u='https://wa.me/'+OWNER_WA+'?text='+encodeURIComponent(t);
  if(u.length>6000) copyText(t,()=>{ alert('内容较长，已复制到剪贴板，请在 WhatsApp 对话里粘贴发送。'); open('https://wa.me/'+OWNER_WA,'_blank'); },'复制申请内容：'); else open(u,'_blank'); };
$('jcp').onclick=()=>{ const r=buildReq(false); if(r) copyText(msgText(r),()=>alert('已复制，请发给站长（WhatsApp、微信或邮件都可以）。'),'复制申请内容：'); };
$('jdl').onclick=()=>{ const r=buildReq(true); if(!r) return; const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(r)],{type:'application/json'})); a.download='join-'+r.people[0].name+'.json'; a.click(); };
$('jgh').onclick=()=>{ const r=buildReq(false); if(!r) return;
  open('https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('加入申请：'+r.people[0].name)+'&body='+encodeURIComponent(summary(r)+'\n\n```json\n'+JSON.stringify(r)+'\n```'),'_blank'); };
const normReq=r=>r.people||[Object.assign({k:'#1',rel:r.rel,to:r.to,toName:r.toName},r.person)];
function readReq(txt){
  try{ const r=JSON.parse(txt.match(/\{[\s\S]*\}/)[0]); if(r.type!=='join-request'||!(r.people||r.person)) throw 0;
    pending=r; const list=normReq(r);
    const tn=o=>{ const x=list.find(q=>q.k===o.to), t=byId(o.to); return x?x.name:(t?t.name:(o.toName||'?')+L('（已找不到）',' (not found)')); };
    $('rv').textContent=(r.from?L('来自：','From: ')+r.from+'\n':'')+list.map(o=>(o.name||'?')+' → '+L('「'+tn(o)+'」的'+(RL[o.rel]||'子女'),'the '+(o.rel||'child')+' of '+tn(o))).join('\n');
    $('rvok').hidden=false; }
  catch(_){ pending=null; $('rvok').hidden=true; $('rv').textContent='读取失败：请粘贴完整的申请内容（以 { 开头），或选择申请文件。'; }
}
$('rd').onclick=()=>readReq($('rt').value);
$('rf').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ $('rt').value=rd.result; readReq(rd.result); }; rd.readAsText(f); e.target.value=''; };
$('rno').onclick=()=>{ $('rt').value=''; pending=null; $('rv').textContent=''; $('rvok').hidden=true; };
$('rvok').onclick=()=>{
  const r=pending; if(!r) return; let pend=normReq(r).slice(), map={}, made=0, guard=0;
  const S=(v,n)=>String(v==null?'':v).slice(0,n);
  while(pend.length&&guard++<30){
    const left=[];
    pend.forEach(o=>{
      const tid=map[o.to]||(byId(o.to)?o.to:''); if(!tid){ left.push(o); return; }
      sel=tid; const n0=people.length; addRel(RL[o.rel]?o.rel:'child'); if(people.length===n0) return;
      const p=byId(sel); map[o.k]=p.id; made++;
      const so={}; SOC.forEach(([k])=>{ const v=S(o.social&&o.social[k],200).trim(); if(v) so[k]=v; });
      Object.assign(p,{name:S(o.name,60)||'新成员',cname:S(o.cname,40),gender:['m','f'].includes(o.gender)?o.gender:'',birth:S(o.birth,20),alive:o.alive!==false,note:S(o.note,500)});
      if(Object.keys(so).length) p.social=so;
      if(typeof o.photo==='string'&&/^data:image\/(jpeg|png);base64,/.test(o.photo)&&o.photo.length<400000) p.photo=o.photo;
    });
    if(left.length===pend.length) break; pend=left;
  }
  save(); toggleEmpty(); closeModal(); pending=null; alert(L('已加入 '+made+' 位成员。','Added '+made+' member(s).'));
};

/* ---------- 工具栏 ---------- */
const syncB=()=>{ $('tgPh').textContent=showPhoto?'显示：照片':'显示：星星'; $('tgAuto').textContent=auto?'自动旋转：开':'自动旋转：关'; $('tg2d').textContent=M2?'视图：2D':'视图：3D'; $('tgAuto').style.display=M2?'none':''; };
$('tgPh').onclick=()=>{ showPhoto=!showPhoto; try{localStorage.setItem(KEY+'-ph',showPhoto?'1':'0')}catch(e){} syncB(); };
$('tgAuto').onclick=()=>{ auto=!auto; syncB(); };
$('rst').onclick=()=>{ cam={yaw:.4,pitch:.3}; fit(); };
syncB();
if(READONLY) { $('add').style.display=$('imp').style.display='none'; }
$('add').onclick=()=>{ const c={x:ctr.x+(Math.random()-.5)*120,y:ctr.y+(Math.random()-.5)*120,z:ctr.z};
  const p=newP({},c); save(); toggleEmpty(); openPanel(p.id); $('name').select(); };
$('lay').onclick=()=>{ layout(); fit(); };
$('exp').onclick=()=>{ const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(people,SER,1)],{type:'application/json'})); a.download='data.json'; a.click(); };
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!Array.isArray(d)) throw 0; if(people.length&&confirm('合并到现有资料？\n确定=合并（相同成员以新文件为准）；取消=用新文件替换全部')){ const m=new Map(people.map(p=>[p.id,p])); let nn=0,uu=0; d.forEach(p=>{ m.has(p.id)?uu++:nn++; m.set(p.id,p); }); people=[...m.values()]; setTimeout(()=>alert(L('合并完成：新增 '+nn+' 位，更新 '+uu+' 位。','Merged: '+nn+' added, '+uu+' updated.')),50); } else people=d; closePanel(); if(people.some(p=>p.x==null||p.z==null)) layout(); save(); fit(); toggleEmpty(); }
    catch(_){ alert('文件格式不正确，请选择由本站导出的 JSON 文件。'); } }; rd.readAsText(f); e.target.value=''; };
addEventListener('resize',resize);
addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); });


/* ---------- 语言 / 2D ---------- */
const ORI=new WeakMap();
function trNode(n){
  if(n.parentNode&&/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)) return;
  const v=n.nodeValue; if(!v.trim()) return;
  let o=ORI.get(n); if(!o||v!==o.cur){ o={zh:v,cur:v}; ORI.set(n,o); }
  const z=o.zh.trim(), out=lang==='en'&&DICT[z]?o.zh.replace(z,DICT[z]):o.zh;
  if(out!==o.cur){ o.cur=out; n.nodeValue=out; }
}
function walk(n){ const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT); let x; while(x=w.nextNode()) trNode(x); }
function applyLang(){
  document.documentElement.lang=lang==='en'?'en':'zh-CN'; document.title=L('星谱 · 家族星图','Star Map · Family Cosmos');
  $('ph').title=L('点击上传照片','Click to upload photo'); walk(document.body); syncB(); setHint();
}
new MutationObserver(ms=>ms.forEach(m=>{ if(m.type==='characterData') trNode(m.target); else m.addedNodes.forEach(n=>n.nodeType===3?trNode(n):n.nodeType===1&&walk(n)); }))
  .observe(document.body,{childList:true,subtree:true,characterData:true});
const setHint=()=>{ $('hint').textContent=M2?'拖动平移 · 滚轮缩放':'拖动旋转 · Shift/右键拖动平移 · 滚轮缩放'; };
$('lang').value=lang; $('lang').onchange=()=>{ lang=$('lang').value; try{localStorage.setItem('xingpu-lang',lang)}catch(e){} applyLang(); };
$('tg2d').onclick=()=>{ M2=!M2; try{localStorage.setItem(KEY+'-2d',M2?'1':'0')}catch(e){} fit(); syncB(); setHint(); };
if(!READONLY) $('menu').prepend($('joinBtn'));
$('mm').onclick=()=>{ const o=$('menu').classList.toggle('open'); $('mm').setAttribute('aria-expanded',o); };
$('menu').addEventListener('click',e=>{ if(e.target.closest('button:not(#inv):not(#invE)')) $('menu').classList.remove('open'); });
cv.addEventListener('pointerdown',()=>$('menu').classList.remove('open'));
applyLang();
resize(); view={x:innerWidth/2,y:innerHeight/2,k:1}; load(); requestAnimationFrame(frame);
</script>
